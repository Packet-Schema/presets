name: CI

# @packet-schema/presets depends on @packet-schema/core from the registry, so
# CI is a plain `npm ci` — no sibling checkout, no credential.
#
# It used to clone Packet-Schema/core alongside this repo to make a
# `file:../core` dependency resolve, using a `CORE_PAT` secret on the premise
# that core was private. core is public, that secret was never set, and
# actions/checkout failed with "Input required and not supplied: token" on
# EVERY run — main included. The 4-stage gate below had therefore never
# actually run in CI. Both the premise and the mechanism are gone now.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Validate presets against PSDL 0.5
        run: npm run check

      - name: Build presets (YAML → PRESETS + tsc)
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

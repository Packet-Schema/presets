name: CI

on:
  push:
    branches: [main]
  pull_request:

# @packet-schema/presets depends on @packet-schema/core via `file:../core`, so
# CI checks out core as a sibling directory to make the file: link resolve,
# builds it, then validates the presets against core's canonical PSDL 0.5
# schema.
#
# The checkout uses the default GITHUB_TOKEN: Packet-Schema/core is a PUBLIC
# repository, so no extra credential is needed. It previously asked for a
# `CORE_PAT` secret on the premise that core was private — that secret was
# never set, so `token:` resolved to an empty string and actions/checkout
# failed with "Input required and not supplied: token" on EVERY run, main
# included. The 4-stage gate below had therefore never actually run in CI.
#
# core is now published to npm, so this sibling-checkout dance can be replaced
# with a plain registry dependency + a single `npm ci` once presets is pinned
# to a published core version.

jobs:
  build-test:
    runs-on: ubuntu-latest
    # Least privilege. Reading a public sibling repo needs nothing more.
    permissions:
      contents: read
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - name: Checkout presets
        uses: actions/checkout@v4
        with:
          path: presets

      - name: Checkout core (sibling for file:../core)
        uses: actions/checkout@v4
        with:
          repository: Packet-Schema/core
          ref: main
          path: core

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: presets/package-lock.json

      - name: Build core
        working-directory: core
        run: |
          npm ci
          npm run build

      - name: Install presets
        working-directory: presets
        run: npm ci

      - name: Validate presets against PSDL 0.5
        working-directory: presets
        run: npm run check

      - name: Build presets (YAML → PRESETS + tsc)
        working-directory: presets
        run: npm run build

      - name: Typecheck
        working-directory: presets
        run: npm run typecheck
